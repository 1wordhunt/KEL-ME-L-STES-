<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskal Kelime Projesi</title>
    <style>
        :root { --bg-black: #000000; --card-dark: #121212; --inner-grey: #282828; --text-grey: #b3b3b3; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        
        /* Liste Tasarımı */
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .word-item { background: white; padding: 15px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .word-text { font-size: 16px; font-weight: 600; }
        .word-tr { font-size: 14px; color: #888; margin-left: 5px; }

        /* Overlay - Resimdeki Koyu Tema */
        #page-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-black); z-index: 1000; justify-content: center; align-items: center; }
        .close-x { position: absolute; top: 20px; right: 20px; font-size: 24px; color: white; cursor: pointer; }

        /* Ana Kart Yapısı (Resimdeki Düzen) */
        .content-container { width: 90%; max-width: 400px; color: white; }
        
        /* Başlık Alanı */
        .header-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .header-area h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 1px; }
        .header-area span { color: var(--text-grey); font-size: 18px; }

        /* Üstteki İki Kutu (Resim ve Film Yazısı) */
        .top-row { display: flex; gap: 15px; margin-bottom: 20px; height: 160px; }
        .img-box { flex: 1; background: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-box img { width: 80%; height: auto; object-fit: contain; }
        .film-box { flex: 1; background: var(--inner-grey); border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; color: var(--text-grey); font-size: 12px; font-weight: bold; }

        /* Alttaki Büyük Video Alanı */
        .player-container { background: var(--card-dark); border-radius: 30px; padding: 20px; position: relative; }
        .video-box { width: 100%; height: 200px; background: #1a1a1a; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .video-box video { width: 100%; height: 100%; object-fit: contain; }

        /* Kontroller */
        .progress-area { margin: 15px 0; }
        .bar-bg { width: 100%; height: 4px; background: #4f4f4f; border-radius: 2px; position: relative; }
        .bar-fill { width: 0%; height: 100%; background: white; border-radius: 2px; }
        .dot { width: 10px; height: 10px; background: white; border-radius: 50%; position: absolute; top: -3px; left: 0%; transform: translateX(-50%); }

        .control-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn-s { background: none; border: none; color: #b3b3b3; font-size: 20px; cursor: pointer; }
        .btn-p { width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: black; font-size: 24px; }
    </style>
</head>
<body>

            </div>

            <div class="top-row">

                <div class="progress-area">

                <div class="control-btns">

        const list = document.getElementById('list');
        wordData.forEach((w, i) => {
            let item = document.createElement('div');
            item.className = 'word-item';
            item.onclick = () => openView(i, true);
            item.innerHTML = `<div class="word-text"><b>${i + 1}.</b> ${w.en} <span class="word-tr">${w.tr}</span></div><span>🔊</span>`;
            list.appendChild(item);
        });

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const wordParam = urlParams.get('kelime');
            if (wordParam) {
                const index = wordData.findIndex(w => w.en.toLowerCase() === wordParam.toLowerCase());
                if (index !== -1) openView(index, false);
            }
        };

        function openView(index, updateUrl) {
            currentIndex = index;
            const w = wordData[currentIndex];
            if(updateUrl) {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?kelime=' + w.en;
                window.history.pushState({path:newUrl},'',newUrl);
            }

            document.getElementById('txtEn').innerText = w.en.toUpperCase();
            document.getElementById('txtTr').innerText = `(${w.tr})`;
            
            // Video (Durmuş başlar, preload açık)
            if(w.vid) {
                document.getElementById('videoArea').innerHTML = `
                <video id="vPlayer" loop playsinline preload="auto" ontimeupdate="updateProgress()">
                    <source src="videolar/${w.vid}" type="video/mp4">
                </video>`;
                document.getElementById('pBtn').innerText = "▶"; 
            }

            document.getElementById('page-overlay').style.display = 'flex';
        }

        function playHandler() {
            const v = document.getElementById('vPlayer');
            if(v) {
                if (v.paused) { v.play(); document.getElementById('pBtn').innerText = "⏸"; }
                else { v.pause(); document.getElementById('pBtn').innerText = "▶"; }
            }
        }

        function updateProgress() {
            const v = document.getElementById('vPlayer');
            if(v && v.duration) {
                let perc = (v.currentTime / v.duration) * 100;
                document.getElementById('pFill').style.width = perc + "%";
                document.getElementById('pDot').style.left = perc + "%";
            }
        }

        function changeWord(dir) {
            currentIndex = (currentIndex + dir + wordData.length) % wordData.length;
            openView(currentIndex, true);
        }

        function closeView() {
            document.getElementById('page-overlay').style.display = 'none';
            document.getElementById('videoArea').innerHTML = '';
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path:cleanUrl},'',cleanUrl);
            window.speechSynthesis.cancel();
        }

        function ttsFromOverlay() {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(wordData[currentIndex].en);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }
