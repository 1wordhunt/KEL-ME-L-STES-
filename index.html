<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskal 100 - Burak Developer Fix</title>
    <style>
        :root { --bg: #000; --card: #121212; --green: #1DB954; --grey: #282828; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .word-item { background: #1a1a1a; padding: 16px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; }
        .content { width: 92%; max-width: 400px; position: relative; }
        .top-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .img-box { flex: 1; height: 140px; background: var(--grey); border-radius: 18px; overflow: hidden; border: 1px solid #444; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .video-box { flex: 1; height: 140px; background: var(--grey); border-radius: 18px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; }
        .main-player { width: 100%; height: 240px; background: #000; border-radius: 22px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; margin-bottom: 12px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .play-btn { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); z-index: 2; }
        .circle { width: 55px; height: 55px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px; }
        .song-circle { background: var(--green); color: white; width: 45px; height: 45px; }
        .controls-card { background: var(--card); border-radius: 30px; padding: 25px; border: 1px solid #333; }
        .nav-btns { display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .close-btn { position: absolute; top: -60px; right: 0; font-size: 45px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <h1 style="text-align: center; letter-spacing: 3px; margin-bottom: 25px;">ESKAL 100</h1>
    <div class="list-container" id="list"></div>

    <div id="overlay">
        <div class="content">
            <div class="close-btn" onclick="closePopup()">✕</div>
            <h2 id="wordTitle" style="text-align:center; margin-bottom:15px; letter-spacing:2px; text-transform:uppercase;">WORD</h2>
            <div class="top-row">
                <div class="img-box"><img id="targetImg" src="" alt="Yükleniyor..."></div>
                <div class="video-box" onclick="togglePlay('songVid', 'songBtn')">
                    <div class="play-btn" id="songBtn"><div class="circle song-circle">▶</div></div>
                    <video id="songVid" loop playsinline><source src="" type="video/mp4"></video>
                </div>
            </div>
            <div class="controls-card">
                <div class="main-player" onclick="togglePlay('filmVid', 'filmBtn')">
                    <div class="play-btn" id="filmBtn"><div class="circle">▶</div></div>
                    <video id="filmVid" loop playsinline><source src="" type="video/mp4"></video>
                </div>
                <div class="nav-btns">
                    <button class="icon-btn" onclick="move(-1)">⏮</button>
                    <button class="icon-btn" style="font-size:45px" id="masterPlay" onclick="togglePlay('filmVid', 'filmBtn')">▶</button>
                    <button class="icon-btn" onclick="move(1)">⏭</button>
                </div>
            </div>
        </div>
    </div>

        ];

D-20260419-WA0007.mp4", "VID-20260419-WA0011.mp4", "VID-20260419-WA0009.mp4", "VID-20260419-WA0013.mp4", "VID-20260419-WA0015.mp4", "VID-20260419-WA0019.mp4", "VID-20260419-WA0017.mp4", "VID-20260419-WA0021.mp4", "VID-20260419-WA0023.mp4", "VID-20260419-WA0025.mp4", "VID-20260419-WA0027.mp4", "VID-20260419-WA0029.mp4", "VID-20260419-WA0039.mp4", "VID-20260419-WA0041.mp4", "VID-20260419-WA0044.mp4", "VID-20260419-WA0049.mp4", "VID-20260419-WA0051.mp4", "VID-20260419-WA0053.mp4", "VID-20260419-WA0057.mp4", "VID-20260419-WA0058.mp4", "VID-20260419-WA0062.mp4", "VID-20260419-WA0061.mp4", "VID-20260419-WA0073.mp4", "VID-20260419-WA0075.mp4", "VID-20260419-WA0079.mp4", "VID-20260419-WA0080.mp4", "VID-20260419-WA0082.mp4"];

        let curIndex = 0;
        const listDiv = document.getElementById('list');
        words.forEach((w, i) => {
            let row = document.createElement('div');
            row.className = 'word-item';
            row.onclick = () => openPopup(i);
            row.innerHTML = `<span><b>${i+1}.</b> ${w.toUpperCase()}</span><span>▶</span>`;
            listDiv.appendChild(row);
        });

        function openPopup(i) {
            curIndex = i;
            document.getElementById('wordTitle').innerText = words[i].toUpperCase();
            
            // Link listesinden resimi çek (Eğer link yoksa 0. resmi göster)
            document.getElementById('targetImg').src = ibbLinks[i] || ibbLinks[0];
            
            // Şarkı ve Film ataması
            document.getElementById('songVid').src = `videolar/${songVids[i]}`;
            let filmNum = 22 + i;
            document.getElementById('filmVid').src = `videolar/VID-20260326-WA0${filmNum.toString().padStart(3, '0').slice(-3)}.mp4`;
            
            // Reset UI
            document.getElementById('songBtn').style.opacity = "1";
            document.getElementById('filmBtn').style.opacity = "1";
            document.getElementById('masterPlay').innerText = "▶";
            document.getElementById('overlay').style.display = 'flex';
        }

        function togglePlay(vidId, btnId) {
            let v = document.getElementById(vidId);
            let b = document.getElementById(btnId);
            if(v.paused) { v.play(); b.style.opacity = "0"; if(vidId === 'filmVid') document.getElementById('masterPlay').innerText = "⏸"; } 
            else { v.pause(); b.style.opacity = "1"; if(vidId === 'filmVid') document.getElementById('masterPlay').innerText = "▶"; }
        }

        function move(dir) { curIndex = (curIndex + dir + words.length) % words.length; openPopup(curIndex); }
        function closePopup() { document.getElementById('overlay').style.display = 'none'; document.querySelectorAll('video').forEach(v => { v.pause(); v.currentTime = 0; }); }
    </script>
</body>
</html>
