<!DOCTYPE html>

    <title>My Awesome Tübitak Team Word List</title>
    <style>
        :root { --bg: #000; --card: #121212; --green: #1DB954; --grey: #282828; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 50px; }
        .word-item { 
            background: #1a1a1a; padding: 18px; border-radius: 15px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);
        }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .content { width: 90%; max-width: 400px; position: relative; }
        .top-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .img-box, .song-box { flex: 1; height: 140px; background: var(--grey); border-radius: 15px; overflow: hidden; border: 1px solid #444; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .film-container { background: var(--card); border-radius: 25px; padding: 15px; border: 1px solid var(--border); }
        .main-player { width: 100%; height: 200px; background: #000; border-radius: 15px; overflow: hidden; position: relative; border: 1px solid #444; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); pointer-events: none; }
        .circle { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; }
        .nav-btns { display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { background: none; border: none; color: white; font-size: 30px; cursor: pointer; }
        .close-btn { position: absolute; top: -50px; right: 0; font-size: 35px; color: #fff; cursor: pointer; }
    </style>
</head>

            <div class="film-container">
