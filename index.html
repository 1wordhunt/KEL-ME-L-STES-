<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burak Developer | Spotify Word Player</title>
    <style>
        /* Tam olarak ekran görüntüsündeki o siyah, premium tema */
        body {
            background-color: #000000;
            color: white;
            font-family: 'Circular', sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }

        .main-card {
            background-color: #121212;
            width: 380px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .word-name {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Üstteki iki küçük görsel alanı */
        .top-images {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .top-images img, .top-images .text-box {
            width: 48%;
            aspect-ratio: 4/3;
            border-radius: 12px;
            object-fit: cover;
        }

        .text-box {
            background-color: #1a3a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            padding: 5px;
        }

        /* Ana Video Alanı (Harry Potter'ın olduğu yer) */
        .video-container {
            background-color: #000;
            border-radius: 20px;
            padding: 10px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            border-radius: 15px;
        }

        /* Alt Kontrol Paneli (Müzik çalar ikonları) */
        .player-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
        }

        .btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 20px;
            cursor: pointer;
        }

        .btn:hover { color: white; }

        .play-line {
            width: 100%;
            height: 4px;
            background: #444;
            margin: 15px 0;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div id="wordTitle" class="word-name">TIME</div>

    <div class="top-images">
        <img id="img1" src="https://www.ibb.istanbul/Link88_1" alt="Resim 1">
        <div class="text-box" id="imgText">It's right here to make you again...</div>
    </div>

    <div class="video-container">
        <video id="mainVideo" controls>
            <source id="videoSrc" src="videos/VID-20260421-WA0027.mp4" type="video/mp4">
        </video>
    </div>

    <div class="play-line"></div>

    <div class="player-controls">
        <button class="btn">⇄</button>
        <button class="btn" onclick="changeWord(-1)">⏮</button>
        <button class="btn" style="font-size: 30px;" onclick="document.getElementById('audioTrack').play()">⏸</button>
        <button class="btn" onclick="changeWord(1)">⏭</button>
        <button class="btn">↻</button>
    </div>

    <audio id="audioTrack"></audio>
</div>

<script>
// Senin tüm o 100'lük arşivin (Ses, Video, Resim)
const wordData = [
    { word: "Time", img: "https://www.ibb.istanbul/Link88", sound: "AUD-20260421-WA0097.mp3", video: "VID-20260421-WA0027.mp4" },
    { word: "Year", img: "https://www.ibb.istanbul/Link89", sound: "AUD-20260421-WA0098.mp3", video: "VID-20260421-WA0028.mp4" },
    { word: "People", img: "https://www.ibb.istanbul/Link90", sound: "AUD-20260421-WA0099.mp3", video: "VID-20260421-WA0029.mp4" },
    { word: "Strongly", img: "https://www.ibb.istanbul/Link100", sound: "AUD-20260421-WA0109.mp3", video: "VID-20260421-WA0002.mp4" },
    // ... Aradaki tüm 100 kelime burada ...
];

let currentIndex = 0;

function updateDisplay() {
    const data = wordData[currentIndex];
    document.getElementById('wordTitle').innerText = data.word;
    document.getElementById('img1').src = data.img;
    document.getElementById('audioTrack').src = "sounds/" + data.sound;
    
    const video = document.getElementById('mainVideo');
    document.getElementById('videoSrc').src = "videos/" + data.video;
    video.load();
    
    document.getElementById('audioTrack').play().catch(() => {});
}

function changeWord(step) {
    currentIndex += step;
    if (currentIndex < 0) currentIndex = wordData.length - 1;
    if (currentIndex >= wordData.length) currentIndex = 0;
    updateDisplay();
}

window.onload = updateDisplay;
</script>

</body>
</html>
