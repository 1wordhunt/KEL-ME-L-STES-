<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burak Developer | Word List Master</title>
    <style>
        body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* Üstteki Aktif Oynatıcı Paneli */
        .active-player {
            width: 100%; max-width: 450px; background: #121212; padding: 20px; border-radius: 20px; 
            margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; border: 1px solid #333;
        }
        .active-word { font-size: 28px; font-weight: bold; color: #1DB954; margin-bottom: 10px; text-transform: uppercase; }
        video { width: 100%; border-radius: 12px; border: 1px solid #1DB954; margin-top: 10px; }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }

        /* Kelime Listesi Alanı */
        .list-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 8px; }
        .word-row {
            background: #181818; padding: 15px; border-radius: 12px; display: flex; 
            justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .word-row:hover { background: #282828; transform: scale(1.02); }
        .word-info { display: flex; align-items: center; gap: 15px; }
        .num { color: #888; font-size: 14px; width: 25px; }
        .eng { font-weight: bold; font-size: 17px; }
        .tr { color: #b3b3b3; font-size: 14px; }
        .play-btn { color: #1DB954; font-size: 20px; }
    </style>
</head>
<body>

<div class="active-player" id="player">
    <div class="active-word" id="currentWord">BİR KELİME SEÇ</div>
    <img id="currentImg" src="https://www.ibb.istanbul/LinkDefault" alt="Resim">
    <video id="currentVid" controls><source id="vidSrc" src="" type="video/mp4"></video>
    <audio id="currentAud"></audio>
</div>

<div class="list-container" id="listArea"></div>

<script>
// Elimizdeki 100'lük dev arşivin bir kısmı (Sıralama PDF'indeki gibi)
const wordData = [
    { id: 1, eng: "Time", tr: "Zaman", img: "ibb.istanbul/Link1", aud: "AUD-20260421-WA0097.mp3", vid: "VID-20260421-WA0027.mp4" },
    { id: 2, eng: "Year", tr: "Yıl", img: "ibb.istanbul/Link2", aud: "AUD-20260421-WA0098.mp3", vid: "VID-20260421-WA0028.mp4" },
    { id: 3, eng: "People", tr: "İnsanlar", img: "ibb.istanbul/Link3", aud: "AUD-20260421-WA0099.mp3", vid: "VID-20260421-WA0029.mp4" },
    { id: 4, eng: "Way", tr: "Yol", img: "ibb.istanbul/Link4", aud: "AUD-20260421-WA0086.mp3", vid: "VID-20260421-WA0030.mp4" },
    // ... Bu liste böyle 100'e kadar gidiyor kanka
    { id: 100, eng: "Strongly", tr: "Güçlüce", img: "ibb.istanbul/Link100", aud: "AUD-20260421-WA0109.mp3", vid: "VID-20260421-WA0002.mp4" }
];

const listArea = document.getElementById('listArea');

// Listeyi oluşturma
wordData.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.onclick = () => playWord(index);
    row.innerHTML = `
        <div class="word-info">
            <span class="num">${item.id}.</span>
            <div><span class="eng">${item.eng}</span> <span class="tr">(${item.tr})</span></div>
        </div>
        <div class="play-btn">▶</div>
    `;
    listArea.appendChild(row);
});

// Kelimeye basınca medyayı yükleyen fonksiyon
function playWord(i) {
    const data = wordData[i];
    document.getElementById('currentWord').innerText = data.eng;
    document.getElementById('currentImg').src = "https://www.ibb.istanbul/" + data.img;
    document.getElementById('currentAud').src = "sounds/" + data.aud;
    document.getElementById('vidSrc').src = "videos/" + data.vid;
    
    const v = document.getElementById('currentVid');
    v.load(); v.play();
    document.getElementById('currentAud').play();
}
</script>
</body>
</html>
