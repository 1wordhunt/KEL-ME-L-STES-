<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskal Kelime Projesi - Burak Developer</title>
    <style>
        :root { --bg-black: #000000; --card-dark: #121212; --inner-grey: #282828; --text-grey: #b3b3b3; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; margin: 0; padding: 20px; color: white; }
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .word-item { background: #1a1a1a; padding: 18px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .word-tr { font-size: 14px; color: #888; margin-left: 5px; }
        #page-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .content-container { width: 95%; max-width: 400px; position: relative; }
        .header-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; font-size: 22px; font-weight: bold; }
        .top-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .img-box { flex: 1; background: var(--inner-grey); border-radius: 20px; height: 120px; border: 1px solid #444; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .song-box { flex: 1; background: var(--inner-grey); border-radius: 20px; height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-grey); font-size: 11px; padding: 10px; border: 1px solid #444; word-break: break-all; }
        .player-container { background: var(--card-dark); border-radius: 30px; padding: 25px; border: 1px solid #333; }
        .video-box { width: 100%; height: 250px; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid #444; display: flex; align-items: center; justify-content: center; }
        .video-box video { width: 100%; height: 100%; object-fit: cover !important; }
        .progress-area { margin: 25px 0; }
        .bar-bg { width: 100%; height: 5px; background: #333; border-radius: 3px; position: relative; cursor: pointer; }
        .bar-fill { width: 0%; height: 100%; background: #fff; border-radius: 3px; }
        .dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; position: absolute; top: -5px; left: 0%; transform: translateX(-50%); }
        .control-btns { display: flex; justify-content: space-between; align-items: center; }
        .btn-p { width: 70px; height: 70px; background: #fff; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: black; }
        .close-x { position: absolute; top: -50px; right: 0; font-size: 35px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="text-align:center; letter-spacing: 2px;">ESKAL KELİME PROJESI</h1>
    <div class="list-container" id="list"></div>
    <div id="page-overlay">
        <div class="content-container">
            <div class="close-x" onclick="closeView()">✕</div>
            <div class="header-area"><div id="txtEn">WORD</div> <span id="txtTr">(cevap)</span></div>
            <div class="top-row">
                <div class="img-box" id="imgBox"><img id="wordImg" src="" alt=""></div>
                <div class="song-box" id="songText">ŞARKI YÜKLENİYOR...</div>
            </div>
            <div class="player-container">
                <div class="video-box" id="videoArea"></div>
                <div class="progress-area"><div class="bar-bg" onclick="seek(event)"><div class="bar-fill" id="pFill"></div><div class="dot" id="pDot"></div></div></div>
                <div class="control-btns">
                    <button style="background:none; border:none; color:#555; font-size:20px;">🔀</button>
                    <button style="background:none; border:none; color:#fff; font-size:24px;" onclick="changeWord(-1)">⏮</button>
                    <button id="pBtn" class="btn-p" onclick="playHandler()">▶</button>
                    <button style="background:none; border:none; color:#fff; font-size:24px;" onclick="changeWord(1)">⏭</button>
                    <button style="background:none; border:none; color:#555; font-size:20px;">🔁</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let currentIndex = 0;
        // Resim ve Şarkı Eşleşmeleri
        const wordData = [
            {en:"time", tr:"zaman", vid:"VID-20260414-WA0010.mp4", img:"https://i.ibb.co/KjtKG5t7/MG-20260414-WA0000.jpg"},
            {en:"year", tr:"yıl", vid:"VID-20260414-WA0011.mp4", img:"https://i.ibb.co/Lds0rNqZ/MG-20260414-WA0001.jpg"},
            {en:"people", tr:"insanlar", vid:"VID-20260414-WA0012.mp4", img:"https://i.ibb.co/9HnQS1Np/MG-20260414-WA0002.jpg"},
            {en:"way", tr:"yol", vid:"VID-20260414-WA0013.mp4", img:"https://i.ibb.co/KxVybz3W/MG-20260414-WA0003.jpg"},
            {en:"day", tr:"gün", vid:"VID-20260414-WA0014.mp4", img:"https://i.ibb.co/LXfmxrBf/MG-20260414-WA0004.jpg"},
            {en:"man", tr:"adam", vid:"VID-20260414-WA0015.mp4", img:"https://i.ibb.co/Wv9Lhxq8/MG-20260414-WA0005.jpg"},
            {en:"thing", tr:"şey", vid:"VID-20260414-WA0016.mp4", img:"https://i.ibb.co/ks3BjpND/MG-20260414-WA0006.jpg"},
            {en:"woman", tr:"kadın", vid:"VID-20260414-WA0017.mp4", img:"https://i.ibb.co/20QVq8y2/MG-20260414-WA0007.jpg"},
            {en:"life", tr:"hayat", vid:"VID-20260414-WA0018.mp4", img:"https://i.ibb.co/pB0Ky6wS/MG-20260414-WA0008.jpg"},
            {en:"child", tr:"çocuk", vid:"VID-20260414-WA0019.mp4", img:"https://i.ibb.co/QF7g44Md/MG-20260414-WA0009.jpg"},
            // Diğer kelimeler için mevcut video yollarını koru...
            {en:"world", tr:"dünya", vid:"VID-20260326-WA0039.mp4"}, {en:"school", tr:"okul", vid:"VID-20260326-WA0040.mp4"}
            // ... (Liste devam eder)
        ];

        const list = document.getElementById('list');
        wordData.forEach((w, i) => {
            let item = document.createElement('div');
            item.className = 'word-item';
            item.onclick = () => openView(i, true);
            item.innerHTML = `<div><b>${i+1}.</b> ${w.en} <span class="word-tr">(${w.tr})</span></div><span style="color:#fff">▶</span>`;
            list.appendChild(item);
        });

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const targetWord = params.get('kelime');
            if (targetWord) {
                const index = wordData.findIndex(w => w.en.toLowerCase() === targetWord.toLowerCase());
                if (index !== -1) openView(index, false);
            }
        };

        function openView(index, updateUrl) {
            currentIndex = index;
            const w = wordData[currentIndex];
            if(updateUrl) {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?kelime=' + w.en;
                window.history.pushState({path:newUrl},'',newUrl);
            }

            const imgEl = document.getElementById('wordImg');
            if(w.img) { imgEl.src = w.img; imgEl.style.display = 'block'; }
            else { imgEl.style.display = 'none'; }

            document.getElementById('songText').innerText = w.vid;
            document.getElementById('txtEn').innerText = w.en.toUpperCase();
            document.getElementById('txtTr').innerText = `(${w.tr})`;
            document.getElementById('videoArea').innerHTML = `<video id="vPlayer" loop playsinline preload="auto" ontimeupdate="updateProgress()"><source src="videolar/${w.vid}" type="video/mp4"></video>`;
            document.getElementById('pBtn').innerText = "▶"; 
            document.getElementById('page-overlay').style.display = 'flex';
        }

        function playHandler() {
            const v = document.getElementById('vPlayer');
            if(v) { (v.paused ? (v.play(), document.getElementById('pBtn').innerText = "⏸") : (v.pause(), document.getElementById('pBtn').innerText = "▶")); }
        }

        function updateProgress() {
            const v = document.getElementById('vPlayer');
            if(v && v.duration) {
                let perc = (v.currentTime / v.duration) * 100;
                document.getElementById('pFill').style.width = perc + "%";
                document.getElementById('pDot').style.left = perc + "%";
            }
        }

        function seek(e) {
            const v = document.getElementById('vPlayer');
            if(v && v.duration) {
                const rect = e.target.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                v.currentTime = pos * v.duration;
            }
        }

        function changeWord(dir) { currentIndex = (currentIndex + dir + wordData.length) % wordData.length; openView(currentIndex, true); }
        function closeView() { document.getElementById('page-overlay').style.display = 'none'; document.getElementById('videoArea').innerHTML = ''; }
    </script>
</body>
</html>
