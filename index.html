<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Tübitak Team Word List</title>
    <style>
        :root { --bg-black: #000000; --card-dark: #121212; --inner-grey: #282828; --text-grey: #b3b3b3; --spotify-green: #1DB954; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; margin: 0; padding: 20px; color: white; }
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .word-item { background: #1a1a1a; padding: 18px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        #page-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .content-container { width: 95%; max-width: 400px; position: relative; }
        .top-row { display: flex; gap: 15px; margin-bottom: 15px; }
        
        .img-box { flex: 1; background: var(--inner-grey); border-radius: 20px; height: 130px; border: 1px solid #444; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* ŞARKI VE FİLM KUTULARI */
        .media-box { flex: 1; background: var(--inner-grey); border-radius: 20px; position: relative; overflow: hidden; border: 1px solid #444; cursor: pointer; }
        .song-size { height: 130px; }
        .film-size { width: 100%; height: 230px; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* OYNAT BUTONLARI */
        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2); z-index: 10; transition: opacity 0.3s;
        }
        .btn-circle { width: 50px; height: 50px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px; }
        .song-btn { background: var(--spotify-green); color: #fff; width: 40px; height: 40px; font-size: 18px; }

        .player-container { background: var(--card-dark); border-radius: 30px; padding: 20px; border: 1px solid #333; }
        .progress-area { margin: 20px 0; }
        .bar-bg { width: 100%; height: 5px; background: #333; border-radius: 3px; cursor: pointer; }
        .bar-fill { width: 0%; height: 100%; background: #fff; border-radius: 3px; }
        
        .control-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        .dim { color: #555; }
        
        .close-x { position: absolute; top: -50px; right: 0; font-size: 35px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">My Awesome Tübitak Team Word List</h1>
    <div class="list-container" id="list"></div>

    <div id="page-overlay">
        <div class="content-container">
            <div class="close-x" onclick="closeView()">✕</div>
            <h2 id="txtEn" style="text-align:center; margin-bottom:15px; letter-spacing:2px;">WORD</h2>
            
            <div class="top-row">
                <div class="img-box"><img id="wordImg" src="" alt=""></div>
                <div class="media-box song-size" onclick="toggleMedia('sPlayer', 'sOverlay')">
                    <div class="play-overlay" id="sOverlay"><div class="btn-circle song-btn">▶</div></div>
                    <video id="sPlayer" loop playsinline><source src="" type="video/mp4"></video>
                </div>
            </div>

            <div class="player-container">
                <div class="media-box film-size" onclick="toggleMedia('fPlayer', 'fOverlay')">
                    <div class="play-overlay" id="fOverlay"><div class="btn-circle">▶</div></div>
                    <video id="fPlayer" loop playsinline ontimeupdate="updateProgress()"><source src="" type="video/mp4"></video>
                </div>

                <div class="progress-area">
                    <div class="bar-bg" onclick="seek(event)"><div class="bar-fill" id="pFill"></div></div>
                </div>

                <div class="control-btns">
                    <button class="icon-btn dim">🔀</button>
                    <button class="icon-btn" onclick="changeWord(-1)">⏮</button>
                    <button class="icon-btn" style="font-size: 30px;"></button>
                    <button class="icon-btn" onclick="changeWord(1)">⏭</button>
                    <button class="icon-btn dim">🔁</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const wordData = [
            {en:"time", tr:"zaman", img:"https://i.ibb.co/KjtKG5t7/MG-20260414-WA0000.jpg", song:"VID-20260414-WA0010.mp4", film:"VID-20260326-WA0029.mp4"},
            {en:"year", tr:"yıl", img:"https://i.ibb.co/Lds0rNqZ/MG-20260414-WA0001.jpg", song:"VID-20260414-WA0011.mp4", film:"VID-20260326-WA0030.mp4"},
            {en:"people", tr:"insanlar", img:"https://i.ibb.co/9HnQS1Np/MG-20260414-WA0002.jpg", song:"VID-20260414-WA0012.mp4", film:"VID-20260326-WA0031.mp4"},
            {en:"way", tr:"yol", img:"https://i.ibb.co/KxVybz3W/MG-20260414-WA0003.jpg", song:"VID-20260414-WA0013.mp4", film:"VID-20260326-WA0032.mp4"},
            {en:"day", tr:"gün", img:"https://i.ibb.co/LXfmxrBf/MG-20260414-WA0004.jpg", song:"VID-20260414-WA0014.mp4", film:"VID-20260326-WA0033.mp4"},
            {en:"man", tr:"adam", img:"https://i.ibb.co/Wv9Lhxq8/MG-20260414-WA0005.jpg", song:"VID-20260414-WA0015.mp4", film:"VID-20260326-WA0034.mp4"},
            {en:"thing", tr:"şey", img:"https://i.ibb.co/ks3BjpND/MG-20260414-WA0006.jpg", song:"VID-20260414-WA0016.mp4", film:"VID-20260326-WA0035.mp4"},
            {en:"woman", tr:"kadın", img:"https://i.ibb.co/20QVq8y2/MG-20260414-WA0007.jpg", song:"VID-20260414-WA0017.mp4", film:"VID-20260326-WA0036.mp4"},
            {en:"life", tr:"hayat", img:"https://i.ibb.co/pB0Ky6wS/MG-20260414-WA0008.jpg", song:"VID-20260414-WA0018.mp4", film:"VID-20260326-WA0037.mp4"},
            {en:"child", tr:"çocuk", img:"https://i.ibb.co/QF7g44Md/MG-20260414-WA0009.jpg", song:"VID-20260414-WA0019.mp4", film:"VID-20260313-WA0028.mp4"}
        ];

        const list = document.getElementById('list');
        wordData.forEach((w, i) => {
            let item = document.createElement('div');
            item.className = 'word-item';
            item.onclick = () => openView(i);
            item.innerHTML = `<div><b>${i+1}.</b> ${w.en} (${w.tr})</div><span>▶</span>`;
            list.appendChild(item);
        });

        function openView(index) {
            currentIndex = index;
            const w = wordData[index];
            document.getElementById('txtEn').innerText = w.en.toUpperCase();
            document.getElementById('wordImg').src = w.img;
            
            document.getElementById('sPlayer').src = `videolar/${w.song}`;
            document.getElementById('fPlayer').src = `videolar/${w.film}`;
            
            document.getElementById('sOverlay').style.opacity = "1";
            document.getElementById('fOverlay').style.opacity = "1";
            
            document.getElementById('page-overlay').style.display = 'flex';
        }

        function toggleMedia(playerId, overlayId) {
            const p = document.getElementById(playerId);
            const o = document.getElementById(overlayId);
            if(p.paused) { p.play(); o.style.opacity = "0"; }
            else { p.pause(); o.style.opacity = "1"; }
        }

        function updateProgress() {
            const f = document.getElementById('fPlayer');
            if(f.duration) {
                let perc = (f.currentTime / f.duration) * 100;
                document.getElementById('pFill').style.width = perc + "%";
            }
        }

        function seek(e) {
            const f = document.getElementById('fPlayer');
            const rect = e.target.getBoundingClientRect();
            f.currentTime = ((e.clientX - rect.left) / rect.width) * f.duration;
        }

        function changeWord(dir) {
            currentIndex = (currentIndex + dir + wordData.length) % wordData.length;
            openView(currentIndex);
        }

        function closeView() { 
            document.getElementById('page-overlay').style.display = 'none'; 
            document.getElementById('sPlayer').pause();
            document.getElementById('fPlayer').pause();
        }
    </script>
</body>
</html>
