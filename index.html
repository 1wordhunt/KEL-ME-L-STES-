<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burak Developer | WordHunt Spotify Edition</title>
    <style>
        /* Spotify Karanlık Tema */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Circular', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .spotify-card {
            background: linear-gradient(180deg, #121212 0%, #121212 100%);
            width: 90%;
            max-width: 450px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        .word-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #b3b3b3;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .word-title {
            font-size: 48px;
            font-weight: 900;
            margin: 10px 0;
            color: #1DB954; /* Spotify Yeşili */
        }

        .image-container img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 4px 60px rgba(0,0,0,0.5);
        }

        .video-box {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            background: #000;
        }

        video { width: 100%; }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #4d4d4d;
            border-radius: 2px;
            margin: 20px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #1DB954;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            margin-top: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { color: #FFFFFF; transform: scale(1.1); }

        .btn-play {
            background: #FFFFFF;
            color: #000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .btn-play:hover { transform: scale(1.05); background: #1DB954; }

        .counter {
            font-size: 12px;
            color: #b3b3b3;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="spotify-card">
    <div class="word-header">Şu an çalıyor</div>
    <div id="wordDisplay" class="word-title">START</div>
    
    <div class="image-container">
        <img id="wordImg" src="" alt="Album Cover">
    </div>
    
    <div class="video-box">
        <video id="wordVideo" controls>
            <source id="videoSource" src="" type="video/mp4">
        </video>
    </div>

    <audio id="wordAudio"></audio>

    <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="changeWord(-1)">⏮</button>
        <button class="btn btn-play" onclick="playCurrent()">▶</button>
        <button class="btn" onclick="changeWord(1)">⏭</button>
    </div>

    <div class="counter" id="counterDisplay">1 / 100</div>
</div>

<script>
const wordData = [
    // Kelimeler, İBB linkleri ve senin WA videoların
    { word: "Probably", img: "https://www.ibb.istanbul/Link1", sound: "AUD-20260421-WA0010.mp3", video: "VID-20260421-WA0010.mp4" },
    { word: "Especially", img: "https://www.ibb.istanbul/Link2", sound: "AUD-20260421-WA0011.mp3", video: "VID-20260421-WA0107.mp4" },
    { word: "Clearly", img: "https://www.ibb.istanbul/Link91", sound: "AUD-20260421-WA0100.mp3", video: "VID-20260421-WA0014.mp4" },
    { word: "Strongly", img: "https://www.ibb.istanbul/Link100", sound: "AUD-20260421-WA0109.mp3", video: "VID-20260421-WA0002.mp4" }
    // ... Toplam 100 kelime buraya eklenecek
];

let currentIndex = 0;

function updateDisplay() {
    const data = wordData[currentIndex];
    document.getElementById('wordDisplay').innerText = data.word;
    document.getElementById('wordImg').src = data.img;
    document.getElementById('wordAudio').src = "sounds/" + data.sound;
    
    const video = document.getElementById('wordVideo');
    document.getElementById('videoSource').src = "videos/" + data.video;
    video.load();

    document.getElementById('counterDisplay').innerText = (currentIndex + 1) + " / " + wordData.length;
    document.getElementById('progressFill').style.width = ((currentIndex + 1) / wordData.length * 100) + "%";
}

function playCurrent() {
    document.getElementById('wordAudio').play();
}

function changeWord(step) {
    currentIndex += step;
    if (currentIndex < 0) currentIndex = wordData.length - 1;
    if (currentIndex >= wordData.length) currentIndex = 0;
    updateDisplay();
}

window.onload = updateDisplay;
</script>

</body>
</html>
