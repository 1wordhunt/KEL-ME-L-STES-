<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskal 100 Final - Burak Developer</title>
    <style>
        :root { --bg: #000; --card: #121212; --green: #1DB954; --grey: #282828; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .word-item { background: #1a1a1a; padding: 16px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .word-item:active { transform: scale(0.97); }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; }
        .content { width: 92%; max-width: 400px; position: relative; }
        
        .top-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .img-box { flex: 1; height: 140px; background: var(--grey); border-radius: 18px; overflow: hidden; border: 1px solid #444; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .video-box { flex: 1; height: 140px; background: var(--grey); border-radius: 18px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; }
        .main-player { width: 100%; height: 240px; background: #000; border-radius: 22px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; margin-bottom: 12px; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .play-btn { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); transition: opacity 0.4s; }
        .circle { width: 55px; height: 55px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px; }
        .song-circle { background: var(--green); color: white; width: 45px; height: 45px; }

        .controls-card { background: var(--card); border-radius: 30px; padding: 25px; border: 1px solid #333; }
        .nav-btns { display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .close-btn { position: absolute; top: -60px; right: 0; font-size: 45px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <h1 style="text-align: center; letter-spacing: 3px; margin-bottom: 25px;">ESKAL 100</h1>
    <div class="list-container" id="list"></div>

    <div id="overlay">
        <div class="content">
            <div class="close-btn" onclick="closePopup()">✕</div>
            <h2 id="wordTitle" style="text-align:center; margin-bottom:15px; letter-spacing:2px; text-transform:uppercase;">WORD</h2>
            
            <div class="top-row">
                <div class="img-box"><img id="targetImg" src="" alt=""></div>
                <div class="video-box" onclick="togglePlay('songVid', 'songBtn')">
                    <div class="play-btn" id="songBtn"><div class="circle song-circle">▶</div></div>
                    <video id="songVid" loop playsinline><source src="" type="video/mp4"></video>
                </div>
            </div>

            <div class="controls-card">
                <div class="main-player" onclick="togglePlay('filmVid', 'filmBtn')">
                    <div class="play-btn" id="filmBtn"><div class="circle">▶</div></div>
                    <video id="filmVid" loop playsinline><source src="" type="video/mp4"></video>
                </div>
                
                <div class="nav-btns">
                    <button class="icon-btn" onclick="move(-1)">⏮</button>
                    <button class="icon-btn" style="font-size:45px" id="masterPlay" onclick="togglePlay('filmVid', 'filmBtn')">▶</button>
                    <button class="icon-btn" onclick="move(1)">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // TAM SIRALAMA (1-100)
        const words = [
            "time", "year", "people", "way", "day", "man", "thing", "woman", "life", "child",
            "world", "school", "state", "family", "student", "group", "country", "problem", "hand", "part",
            "place", "case", "week", "company", "system", "word", "work", "use", "make", "take",
            "give", "come", "look", "want", "find", "tell", "ask", "try", "need", "feel",
            "become", "leave", "call", "keep", "start", "seem", "help", "talk", "turn", "begin",
            "show", "good", "new", "first", "last", "long", "great", "little", "own", "other",
            "old", "right", "big", "high", "different", "small", "large", "next", "early", "young",
            "important", "few", "public", "bad", "same", "able", "very", "often", "really", "quickly",
            "slowly", "well", "always", "sometimes", "usually", "together", "already", "almost", "especially", "probably",
            "finally", "easily", "recently", "immediately", "nearly", "currently", "clearly", "simply", "exactly", "strongly"
        ];

        const images = {
            "world":"https://i.ibb.co/qY3p7Dxy/MG-20260415-WA0124.jpg", "school":"https://i.ibb.co/fzbXFKr6/MG-20260415-WA0125.jpg",
            "state":"https://i.ibb.co/SDzF8Rkp/MG-20260415-WA0130.jpg", "family":"https://i.ibb.co/sJgqTk8K/MG-20260415-WA0127.jpg",
            "student":"https://i.ibb.co/PsvJmC3m/MG-20260415-WA0128.jpg", "group":"https://i.ibb.co/GQVzJGg7/MG-20260415-WA0129.jpg",
            "country":"https://i.ibb.co/h1TDP9jW/MG-20260415-WA0131.jpg", "problem":"https://i.ibb.co/KzysZqtj/MG-20260415-WA0132.jpg",
            "hand":"https://i.ibb.co/MxDhFXV0/MG-20260415-WA0134.jpg", "part":"https://i.ibb.co/rG4PX3Pw/MG-20260415-WA0135.jpg",
            "place":"https://i.ibb.co/zWQfmBkJ/MG-20260415-WA0136.jpg", "case":"https://i.ibb.co/R40HyyHX/MG-20260415-WA0137.jpg",
            "week":"https://i.ibb.co/zHjsH7TB/MG-20260415-WA0138.jpg", "company":"https://i.ibb.co/8LwfX8K8/MG-20260415-WA0140.jpg",
            "system":"https://i.ibb.co/DJTqtHk/MG-20260415-WA0141.jpg", "word":"https://i.ibb.co/2151RQVz/MG-20260415-WA0143.jpg",
            "work":"https://i.ibb.co/h52kn48/MG-20260415-WA0146.jpg", "use":"https://i.ibb.co/8LFX93dR/MG-20260415-WA0147.jpg",
            "make":"https://i.ibb.co/cKrxkxHV/MG-20260415-WA0148.jpg", "take":"https://i.ibb.co/JR6VBVMd/MG-20260415-WA0151.jpg",
            "give":"https://i.ibb.co/dsvVT0Fd/MG-20260415-WA0152.jpg", "come":"https://i.ibb.co/svhHfsxd/MG-20260415-WA0154.jpg",
            "look":"https://i.ibb.co/cXy2JzCD/MG-20260415-WA0157.jpg", "want":"https://i.ibb.co/h1cn8CY8/MG-20260415-WA0159.jpg",
            "find":"https://i.ibb.co/Wp4SFWjx/MG-20260415-WA0161.jpg", "tell":"https://i.ibb.co/spSqVfvn/MG-20260415-WA0163.jpg",
            "ask":"https://i.ibb.co/j9r7VZTW/MG-20260415-WA0165.jpg", "try":"https://i.ibb.co/W4wTNyQB/MG-20260415-WA0169.jpg",
            "need":"https://i.ibb.co/dssZjnxH/MG-20260415-WA0171.jpg", "feel":"https://i.ibb.co/zht3nyYv/MG-20260415-WA0173.jpg",
            "become":"https://i.ibb.co/PK3QGR7/MG-20260415-WA0175.jpg", "leave":"https://i.ibb.co/0VqFcSXR/MG-20260415-WA0177.jpg",
            "call":"https://i.ibb.co/3YdZpwSM/MG-20260415-WA0180.jpg", "keep":"https://i.ibb.co/VY65Nnxm/MG-20260415-WA0182.jpg",
            "start":"https://i.ibb.co/qF93p0X9/MG-20260415-WA0183.jpg", "help":"https://i.ibb.co/W48T3rKM/MG-20260415-WA0187.jpg",
            "talk":"https://i.ibb.co/qMhddx8P/MG-20260415-WA0189.jpg", "turn":"https://i.ibb.co/gZkD4Ths/MG-20260415-WA0193.jpg",
            "begin":"https://i.ibb.co/n8MM45GG/MG-20260415-WA0194.jpg", "show":"https://i.ibb.co/CKFKhCsv/MG-20260415-WA0197.jpg"
        };

        let curIndex = 0;
        const listDiv = document.getElementById('list');

        words.forEach((w, i) => {
            let row = document.createElement('div');
            row.className = 'word-item';
            row.onclick = () => openPopup(i);
            row.innerHTML = `<span><b>${i+1}.</b> ${w.toUpperCase()}</span><span>▶</span>`;
            listDiv.appendChild(row);
        });

        function openPopup(i) {
            curIndex = i;
            const word = words[i];
            document.getElementById('wordTitle').innerText = word.toUpperCase();
            
            // Linki varsa gösterir, yoksa siyah yer tutucu resmi koyar (sıra bozulmaz)
            document.getElementById('targetImg').src = images[word] || "https://i.ibb.co/KjtKG5t7/MG-20260414-WA0000.jpg"; 

            // Videolar 1. kelimeden 100. kelimeye kadar sırayla WA serileriyle eşleşir
            document.getElementById('songVid').src = `videolar/VID-20260414-WA00${(10 + i).toString().padStart(2,'0')}.mp4`;
            document.getElementById('filmVid').src = `videolar/VID-20260326-WA00${(29 + i).toString().padStart(2,'0')}.mp4`;
            
            document.getElementById('songBtn').style.opacity = "1";
            document.getElementById('filmBtn').style.opacity = "1";
            document.getElementById('masterPlay').innerText = "▶";
            document.getElementById('overlay').style.display = 'flex';
        }

        function togglePlay(vidId, btnId) {
            let v = document.getElementById(vidId);
            let b = document.getElementById(btnId);
            if(v.paused) { 
                v.play(); 
                b.style.opacity = "0"; 
                if(vidId === 'filmVid') document.getElementById('masterPlay').innerText = "⏸";
            } else { 
                v.pause(); 
                b.style.opacity = "1"; 
                if(vidId === 'filmVid') document.getElementById('masterPlay').innerText = "▶";
            }
        }

        function move(dir) {
            curIndex = (curIndex + dir + words.length) % words.length;
            openPopup(curIndex);
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('video').forEach(v => { v.pause(); v.currentTime = 0; });
        }
    </script>
</body>
</html>
