<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskal 100 - Burak Developer</title>
    <style>
        :root { --bg: #000; --card: #121212; --green: #1DB954; --grey: #282828; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; overflow-x: hidden; }
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .word-item { background: #1a1a1a; padding: 16px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .word-item:active { transform: scale(0.97); }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; }
        .content { width: 92%; max-width: 400px; position: relative; }
        
        .top-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .img-box { flex: 1; height: 140px; background: var(--grey); border-radius: 18px; overflow: hidden; border: 1px solid #444; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .video-box { flex: 1; height: 140px; background: var(--grey); border-radius: 18px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; }
        .main-player { width: 100%; height: 240px; background: #000; border-radius: 22px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; margin-bottom: 12px; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .play-btn { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); transition: opacity 0.4s; }
        .circle { width: 55px; height: 55px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px; }
        .song-circle { background: var(--green); color: white; width: 45px; height: 45px; }

        .controls-card { background: var(--card); border-radius: 30px; padding: 25px; border: 1px solid #333; }
        .progress-area { width: 100%; height: 6px; background: #333; border-radius: 3px; margin: 15px 0; cursor: pointer; }
        .progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 3px; }
        
        .nav-btns { display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .close-btn { position: absolute; top: -60px; right: 0; font-size: 45px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <h1 style="text-align: center; letter-spacing: 3px; margin-bottom: 25px;">ESKAL 100 FINAL</h1>
    <div class="list-container" id="list"></div>

    <div id="overlay">
        <div class="content">
            <div class="close-btn" onclick="closePopup()">✕</div>
            <h2 id="wordTitle" style="text-align:center; margin-bottom:15px; letter-spacing:2px;">WORD</h2>
            
            <div class="top-row">
                <div class="img-box"><img id="targetImg" src="" alt=""></div>
                <div class="video-box" onclick="togglePlay('songVid', 'songBtn')">
                    <div class="play-btn" id="songBtn"><div class="circle song-circle">▶</div></div>
                    <video id="songVid" loop playsinline><source src="" type="video/mp4"></video>
                </div>
            </div>

            <div class="controls-card">
                <div class="main-player" onclick="togglePlay('filmVid', 'filmBtn')">
                    <div class="play-btn" id="filmBtn"><div class="circle">▶</div></div>
                    <video id="filmVid" loop playsinline ontimeupdate="updateProgress()"><source src="" type="video/mp4"></video>
                </div>
                
                <div class="progress-area" onclick="seek(event)"><div class="progress-fill" id="fill"></div></div>
                
                <div class="nav-btns">
                    <button class="icon-btn" onclick="move(-1)">⏮</button>
                    <button class="icon-btn" style="font-size:45px" id="masterPlay" onclick="togglePlay('filmVid', 'filmBtn')">▶</button>
                    <button class="icon-btn" onclick="move(1)">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 3 SAYFADAN GELEN TAM 100 KELİME LİSTESİ
        const words = ["time","year","people","way","day","man","thing","woman","life","child","world","school","state","family","student","group","country","problem","hand","part","place","case","week","company","system","word","work","use","make","take","give","come","look","want","find","tell","ask","try","need","feel","become","leave","call","keep","start","seem","help","talk","turn","begin","show","good","new","first","last","long","great","little","own","other","old","right","big","high","different","small","large","next","early","young","important","few","public","bad","same","able","very","often","really","quickly","slowly","well","always","sometimes","usually","together","already","say","next","follow","stop","think","move","live","believe","hold","bring","happen","write","provide"];

        const images = [
            "https://i.ibb.co/KjtKG5t7/MG-20260414-WA0000.jpg","https://i.ibb.co/Lds0rNqZ/MG-20260414-WA0001.jpg","https://i.ibb.co/qY3p7Dxy/MG-20260415-WA0124.jpg","https://i.ibb.co/fzbXFKr6/MG-20260415-WA0125.jpg","https://i.ibb.co/sJgqTk8K/MG-20260415-WA0127.jpg","https://i.ibb.co/PsvJmC3m/MG-20260415-WA0128.jpg","https://i.ibb.co/GQVzJGg7/MG-20260415-WA0129.jpg","https://i.ibb.co/SDzF8Rkp/MG-20260415-WA0130.jpg","https://i.ibb.co/h1TDP9jW/MG-20260415-WA0131.jpg","https://i.ibb.co/KzysZqtj/MG-20260415-WA0132.jpg","https://i.ibb.co/MxDhFXV0/MG-20260415-WA0134.jpg","https://i.ibb.co/rG4PX3Pw/MG-20260415-WA0135.jpg","https://i.ibb.co/zWQfmBkJ/MG-20260415-WA0136.jpg","https://i.ibb.co/R40HyyHX/MG-20260415-WA0137.jpg","https://i.ibb.co/zHjsH7TB/MG-20260415-WA0138.jpg","https://i.ibb.co/8LwfX8K8/MG-20260415-WA0140.jpg","https://i.ibb.co/DJTqtHk/MG-20260415-WA0141.jpg","https://i.ibb.co/2151RQVz/MG-20260415-WA0143.jpg","https://i.ibb.co/h52kn48/MG-20260415-WA0146.jpg","https://i.ibb.co/8LFX93dR/MG-20260415-WA0147.jpg","https://i.ibb.co/bgikm1/strongly.jpg"
        ];

        let index = 0;
        const listContainer = document.getElementById('list');

        words.forEach((w, i) => {
            let row = document.createElement('div');
            row.className = 'word-item';
            row.onclick = () => open(i);
            row.innerHTML = `<span><b>${i+1}.</b> ${w.toUpperCase()}</span><span>▶</span>`;
            listContainer.appendChild(row);
        });

        function open(i) {
            index = i;
            document.getElementById('wordTitle').innerText = words[i].toUpperCase();
            document.getElementById('targetImg').src = images[i] || images[0];
            
            // Burak Developer'ın meşhur klasör düzeni (WA serisi)
            document.getElementById('songVid').src = `videolar/VID-20260414-WA00${(10 + i).toString().padStart(2,'0')}.mp4`;
            document.getElementById('filmVid').src = `videolar/VID-20260326-WA00${(29 + i).toString().padStart(2,'0')}.mp4`;
            
            document.getElementById('songBtn').style.opacity = "1";
            document.getElementById('filmBtn').style.opacity = "1";
            document.getElementById('masterPlay').innerText = "▶";
            document.getElementById('overlay').style.display = 'flex';
        }

        function togglePlay(vid, btn) {
            let v = document.getElementById(vid);
            let b = document.getElementById(btn);
            if(v.paused) { 
                v.play(); b.style.opacity = "0"; 
                if(vid === 'filmVid') document.getElementById('masterPlay').innerText = "⏸";
            } else { 
                v.pause(); b.style.opacity = "1";
                if(vid === 'filmVid') document.getElementById('masterPlay').innerText = "▶";
            }
        }

        function updateProgress() {
            let v = document.getElementById('filmVid');
            document.getElementById('fill').style.width = (v.currentTime / v.duration) * 100 + "%";
        }

        function seek(e) {
            let v = document.getElementById('filmVid');
            let rect = e.currentTarget.getBoundingClientRect();
            v.currentTime = ((e.clientX - rect.left) / rect.width) * v.duration;
        }

        function move(d) {
            index = (index + d + words.length) % words.length;
            open(index);
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('video').forEach(v => v.pause());
        }
    </script>
</body>
</html>
