        // 
        function renderList() {
            Object.keys(data).forEach((word, i) => {
                const item = document.createElement('div');
                item.className = 'word-item';
                item.innerHTML = `<span><b>${i+1}.</b> ${word.toUpperCase()}</span> <span>→</span>`;
                item.onclick = () => openPopup(word);
                listDiv.appendChild(item);
            });

            // 
            const urlWord = new URLSearchParams(window.location.search).get('word');
            if (urlWord && data[urlWord]) openPopup(urlWord);
        }

        function openPopup(word) {
            const vals = data[word];
            document.getElementById('wordTitle').innerText = word;
            document.getElementById('targetImg').src = vals[0];
            document.getElementById('songVid').src = 'videolar/' + vals[1];
            document.getElementById('filmVid').src = 'videolar/' + vals[2];
            document.getElementById('overlay').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.querySelectorAll('video').forEach(v => v.pause());
        }
