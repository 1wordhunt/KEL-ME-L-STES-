                const div = document.createElement('div');
                div.className = 'word-card';
                div.innerHTML = `<span><b>${i+1}.</b> ${w}</span> <img class="play-btn" src="https://cdn-icons-png.flaticon.com/512/0/375.png">`;
                div.onclick = () => openDetails(w);
                listDiv.appendChild(div);
            });
            if(location.hash) openDetails(location.hash.substring(1));
        }

        function openDetails(w) {
            const d = words[w];
            if(!d) return;
            currentIdx = keys.indexOf(w);
            location.hash = w;

            document.getElementById('wordTitle').innerText = w + " (" + d[0] + ")";
            document.getElementById('imgSrc').src = d[1];
            
            const v1 = document.getElementById('v1');
            const v2 = document.getElementById('v2');
            
            v1.src = 'videolar/' + d[2];
            v2.src = 'videolar/' + d[3];
            v1.load(); v2.load();

            document.getElementById('v1Btn').style.opacity = '1';
            document.getElementById('v2Btn').style.opacity = '1';
            document.getElementById('details').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function playMedia(id) {
            const v = document.getElementById(id);
            const btn = document.getElementById(id + 'Btn');
            if(v.paused) { v.play(); btn.style.opacity = '0'; }
            else { v.pause(); btn.style.opacity = '1'; }
            v.onended = () => { btn.style.opacity = '1'; };
        }

        function closeDetails() {
            document.getElementById('details').style.display = 'none';
            document.body.style.overflow = 'auto';
            location.hash = "";
            document.getElementById('v1').pause();
            document.getElementById('v2').pause();
        }

        function nextWord() {
            currentIdx = (currentIdx + 1) % keys.length;
            openDetails(keys[currentIdx]);
        }

        function prevWord() {
            currentIdx = (currentIdx - 1 + keys.length) % keys.length;
            openDetails(keys[currentIdx]);
        }

        // 
        window.onload = init;
    </script>
</body>
</html>
