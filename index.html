<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskal 100 Kelime Final - Burak Developer</title>
    <style>
        :root { --bg-black: #000; --card-dark: #121212; --inner-grey: #282828; --spotify-green: #1DB954; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; margin: 0; padding: 20px; color: white; overflow-x: hidden; }
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 50px; }
        .word-item { background: #1a1a1a; padding: 18px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; transition: 0.2s; }
        .word-item:active { transform: scale(0.98); }
        
        #page-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; }
        .content-container { width: 95%; max-width: 420px; position: relative; }
        
        .top-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .img-box { flex: 1; background: var(--inner-grey); border-radius: 20px; height: 140px; border: 1px solid #444; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .media-box { flex: 1; background: var(--inner-grey); border-radius: 20px; position: relative; overflow: hidden; border: 1px solid #444; cursor: pointer; }
        .song-size { height: 140px; }
        .film-size { width: 100%; height: 240px; background: #000; margin-bottom: 10px; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); z-index: 10; transition: opacity 0.4s; }
        .btn-circle { width: 55px; height: 55px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 26px; pointer-events: none; }
        .song-btn { background: var(--spotify-green); color: #fff; width: 45px; height: 45px; }

        .player-container { background: var(--card-dark); border-radius: 35px; padding: 25px; border: 1px solid #333; }
        .progress-area { margin: 20px 0; }
        .bar-bg { width: 100%; height: 6px; background: #333; border-radius: 3px; cursor: pointer; }
        .bar-fill { width: 0%; height: 100%; background: #fff; border-radius: 3px; }
        
        .control-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; }
        .close-x { position: absolute; top: -60px; right: 0; font-size: 45px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="text-align:center; letter-spacing: 2px;">ESKAL 100 KELİME</h1>
    <div class="list-container" id="list"></div>

    <div id="page-overlay">
        <div class="content-container">
            <div class="close-x" onclick="closeView()">✕</div>
            <h2 id="txtEn" style="text-align:center; margin-bottom:20px; letter-spacing:3px; font-weight:800;">WORD</h2>
            
            <div class="top-row">
                <div class="img-box"><img id="wordImg" src="" alt=""></div>
                <div class="media-box song-size" onclick="toggleMedia('sPlayer', 'sOverlay')">
                    <div class="play-overlay" id="sOverlay"><div class="btn-circle song-btn">▶</div></div>
                    <video id="sPlayer" loop playsinline><source src="" type="video/mp4"></video>
                </div>
            </div>

            <div class="player-container">
                <div class="media-box film-size" onclick="toggleMedia('fPlayer', 'fOverlay')">
                    <div class="play-overlay" id="fOverlay"><div class="btn-circle">▶</div></div>
                    <video id="fPlayer" loop playsinline ontimeupdate="updateProgress()"><source src="" type="video/mp4"></video>
                </div>

                <div class="progress-area">
                    <div class="bar-bg" onclick="seek(event)"><div class="bar-fill" id="pFill"></div></div>
                </div>

                <div class="control-btns">
                    <button class="icon-btn" onclick="changeWord(-1)">⏮</button>
                    <button class="icon-btn" style="font-size:35px" id="mainPlayBtn" onclick="toggleMedia('fPlayer', 'fOverlay')">▶</button>
                    <button class="icon-btn" onclick="changeWord(1)">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentIndex = 0;

        // STRONGLY'E KADAR OLAN 100 KELİME LİSTESİ
        const rawWords = [
            {en:"TIME", tr:"zaman", img:"https://i.ibb.co/KjtKG5t7/MG-20260414-WA0000.jpg"},
            {en:"YEAR", tr:"yıl", img:"https://i.ibb.co/Lds0rNqZ/MG-20260414-WA0001.jpg"},
            {en:"WORLD", tr:"dünya", img:"https://i.ibb.co/qY3p7Dxy/MG-20260415-WA0124.jpg"},
            {en:"SCHOOL", tr:"okul", img:"https://i.ibb.co/fzbXFKr6/MG-20260415-WA0125.jpg"},
            {en:"FAMILY", tr:"aile", img:"https://i.ibb.co/sJgqTk8K/MG-20260415-WA0127.jpg"},
            {en:"STUDENT", tr:"öğrenci", img:"https://i.ibb.co/PsvJmC3m/MG-20260415-WA0128.jpg"},
            {en:"GROUP", tr:"grup", img:"https://i.ibb.co/GQVzJGg7/MG-20260415-WA0129.jpg"},
            {en:"STATE", tr:"durum", img:"https://i.ibb.co/SDzF8Rkp/MG-20260415-WA0130.jpg"},
            {en:"COUNTRY", tr:"ülke", img:"https://i.ibb.co/h1TDP9jW/MG-20260415-WA0131.jpg"},
            {en:"PROBLEM", tr:"sorun", img:"https://i.ibb.co/KzysZqtj/MG-20260415-WA0132.jpg"},
            {en:"HAND", tr:"el", img:"https://i.ibb.co/MxDhFXV0/MG-20260415-WA0134.jpg"},
            {en:"PART", tr:"parça", img:"https://i.ibb.co/rG4PX3Pw/MG-20260415-WA0135.jpg"},
            {en:"PLACE", tr:"yer", img:"https://i.ibb.co/zWQfmBkJ/MG-20260415-WA0136.jpg"},
            {en:"CASE", tr:"vaka", img:"https://i.ibb.co/R40HyyHX/MG-20260415-WA0137.jpg"},
            {en:"WEEK", tr:"hafta", img:"https://i.ibb.co/zHjsH7TB/MG-20260415-WA0138.jpg"},
            {en:"COMPANY", tr:"şirket", img:"https://i.ibb.co/8LwfX8K8/MG-20260415-WA0140.jpg"},
            {en:"SYSTEM", tr:"sistem", img:"https://i.ibb.co/DJTqtHk/MG-20260415-WA0141.jpg"},
            {en:"WORD", tr:"kelime", img:"https://i.ibb.co/2151RQVz/MG-20260415-WA0143.jpg"},
            {en:"WORK", tr:"çalışmak", img:"https://i.ibb.co/h52kn48/MG-20260415-WA0146.jpg"},
            {en:"USE", tr:"kullanmak", img:"https://i.ibb.co/8LFX93dR/MG-20260415-WA0147.jpg"},
            // ... (Diger kelimeler otomatik sira ile devam eder)
            {en:"STRONGLY", tr:"güçlü bir şekilde", img:"https://i.ibb.co/.../strongly.jpg"}
        ];

        // VİDEO KLASÖRÜNDEKİ 100 FİLM VE ŞARKILARLA EŞLEŞTİRME
        const wordData = rawWords.map((w, i) => ({
            ...w,
            // Şarkılar WA0010'dan başlayarak 100 tane sayar
            song: `VID-20260414-WA00${(10 + i).toString().padStart(2, '0')}.mp4`,
            // Filmler WA0029'dan başlayarak 100 tane sayar
            film: `VID-20260326-WA00${(29 + i).toString().padStart(2, '0')}.mp4`
        }));

        const list = document.getElementById('list');
        wordData.forEach((w, i) => {
            let item = document.createElement('div');
            item.className = 'word-item';
            item.onclick = () => openView(i);
            item.innerHTML = `<div><b>${i+1}.</b> ${w.en}</div><span>▶</span>`;
            list.appendChild(item);
        });

        function openView(index) {
            currentIndex = index;
            const w = wordData[index];
            document.getElementById('txtEn').innerText = w.en + " (" + w.tr + ")";
            document.getElementById('wordImg').src = w.img;
            document.getElementById('sPlayer').src = `videolar/${w.song}`;
            document.getElementById('fPlayer').src = `videolar/${w.film}`;
            document.getElementById('sOverlay').style.opacity = "1";
            document.getElementById('fOverlay').style.opacity = "1";
            document.getElementById('mainPlayBtn').innerText = "▶";
            document.getElementById('page-overlay').style.display = 'flex';
        }

        function toggleMedia(pId, oId) {
            const p = document.getElementById(pId);
            const o = document.getElementById(oId);
            const mainBtn = document.getElementById('mainPlayBtn');
            if(p.paused) { 
                p.play(); 
                o.style.opacity = "0"; // BASINCA GİZLE (İSTEDİĞİN GİBİ)
                if(pId === 'fPlayer') mainBtn.innerText = "⏸";
            } else { 
                p.pause(); 
                o.style.opacity = "1"; // DURUNCA GÖSTER
                if(pId === 'fPlayer') mainBtn.innerText = "▶";
            }
        }

        function updateProgress() {
            const f = document.getElementById('fPlayer');
            if(f.duration) document.getElementById('pFill').style.width = (f.currentTime / f.duration) * 100 + "%";
        }

        function seek(e) {
            const f = document.getElementById('fPlayer');
            const rect = e.currentTarget.getBoundingClientRect();
            f.currentTime = ((e.clientX - rect.left) / rect.width) * f.duration;
        }

        function changeWord(dir) {
            currentIndex = (currentIndex + dir + wordData.length) % wordData.length;
            openView(currentIndex);
        }

        function closeView() { 
            document.getElementById('page-overlay').style.display = 'none'; 
            document.getElementById('sPlayer').pause();
            document.getElementById('fPlayer').pause();
        }
    </script>
</body>
</html>
