<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskal 100 - Burak Developer Fix</title>
    <style>
        :root { --bg: #000; --card: #121212; --green: #1DB954; --grey: #282828; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        
        /* Liste Tasarımı */
        .list-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .word-item { 
            background: #1a1a1a; padding: 16px; border-radius: 12px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);
        }

        /* Pop-up (Overlay) */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; justify-content: center; align-items: center; }
        .content { width: 92%; max-width: 400px; position: relative; }
        
        /* Üst Sıra: Resim ve Dün Geceki Şarkılar */
        .top-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .img-box, .song-box { flex: 1; height: 145px; background: var(--grey); border-radius: 18px; overflow: hidden; border: 1px solid #444; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Alt Sıra: Bugün Attığın 100 Film */
        .film-container { background: var(--card); border-radius: 30px; padding: 15px; border: 1px solid var(--border); }
        .main-player { width: 100%; height: 220px; background: #000; border-radius: 20px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #444; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.1); z-index: 2; pointer-events: none; }
        .circle { width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 18px; }
        .song-circle { background: var(--green); color: white; width: 35px; height: 35px; }

        .nav-btns { display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .close-btn { position: absolute; top: -50px; right: 0; font-size: 35px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <h1 style="text-align: center; letter-spacing: 2px;">ESKAL 100</h1>
    <div class="list-container" id="list"></div>

    <div id="overlay">
        <div class="content">
            <div class="close-btn" onclick="closePopup()">✕</div>
            <h2 id="wordTitle" style="text-align:center; margin-bottom:15px; text-transform: uppercase;">KELİME</h2>
            
            <div class="top-row">
                <div class="img-box">
                    <img id="targetImg" src="" alt="Görsel">
                </div>
                <div class="song-box" onclick="togglePlay('songVid', 'songBtn')">
                    <div class="play-overlay" id="songBtn"><div class="circle song-circle">▶</div></div>
                    <video id="songVid" loop playsinline><source src="" type="video/mp4"></video>
                </div>
            </div>

            <div class="film-container">
                <div class="main-player" onclick="togglePlay('filmVid', 'filmBtn')">
                    <div class="play-overlay" id="filmBtn"><div class="circle">▶</div></div>
                    <video id="filmVid" loop playsinline><source src="" type="video/mp4"></video>
                </div>
                
                <div class="nav-btns">
                    <button class="icon-btn" onclick="move(-1)">⏮</button>
                    <button class="icon-btn" style="font-size:40px" id="masterPlay" onclick="togglePlay('filmVid', 'filmBtn')">▶</button>
                    <button class="icon-btn" onclick="move(1)">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const words = ["time", "year", "people", "way", "day", "man", "thing", "woman", "life", "child", "world", "school", "state", "family", "student", "group", "country", "problem", "hand", "part"];

        // Dün geceki şarkıların (Sıralamayı buraya ekleyebilirsin)
        const sarkiListesi = ["VID-20260421-WA0071.mp4", "VID-20260421-WA0072.mp4", "VID-20260421-WA0059.mp4", "VID-20260421-WA0060.mp4"];

        // Bugün attığın 100 film (WA0001, WA0002... diye gidiyor)
        function getFilmPath(i) {
            let num = i + 1;
            return `videolar/VID-20260421-WA${num.toString().padStart(4, '0')}.mp4`;
        }

        // Resimler (Sırasıyla)
        function getImgPath(i) {
            return `https://i.ibb.co/KjtKG5t7/MG-20260414-WA${i.toString().padStart(4, '0')}.jpg`;
        }

        let curIndex = 0;
        const listDiv = document.getElementById('list');

        words.forEach((w, i) => {
            let row = document.createElement('div');
            row.className = 'word-item';
            row.onclick = () => openPopup(i);
            row.innerHTML = `<span><b>${i+1}.</b> ${w.toUpperCase()}</span><span style="color:var(--green)">GÖRÜNTÜLE</span>`;
            listDiv.appendChild(row);
        });

        function openPopup(i) {
            curIndex = i;
            document.getElementById('wordTitle').innerText = words[i].toUpperCase();
            document.getElementById('targetImg').src = getImgPath(i);
            
            // Üstteki sağ kutu: Dün geceki şarkılar
            document.getElementById('songVid').src = `videolar/${sarkiListesi[i % sarkiListesi.length]}`;
            // Alttaki büyük kutu: Bugün attığın filmler
            document.getElementById('filmVid').src = getFilmPath(i);

            document.getElementById('songBtn').style.opacity = "1";
            document.getElementById('filmBtn').style.opacity = "1";
            document.getElementById('masterPlay').innerText = "▶";
            document.getElementById('overlay').style.display = 'flex';
        }

        function togglePlay(vidId, btnId) {
            let v = document.getElementById(vidId);
            let b = document.getElementById(btnId);
            if(v.paused) { 
                v.play(); 
                b.style.opacity = "0"; 
                if(vidId === 'filmVid') document.getElementById('masterPlay').innerText = "⏸";
            } else { 
                v.pause(); 
                b.style.opacity = "1"; 
                if(vidId === 'filmVid') document.getElementById('masterPlay').innerText = "▶";
            }
        }

        function move(dir) { 
            curIndex = (curIndex + dir + words.length) % words.length; 
            openPopup(curIndex); 
        }

        function closePopup() { 
            document.getElementById('overlay').style.display = 'none'; 
            document.querySelectorAll('video').forEach(v => { v.pause(); }); 
        }
    </script>
</body>
</html>
